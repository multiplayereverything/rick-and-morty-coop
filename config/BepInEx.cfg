## Rick and Morty Together: BepInEx settings for Rick and Morty: Virtual Rick-ality (Unity 5.4.3).
## The game loads its scripts into a child domain; BepInEx must start at the first scene load, after the game's
## scripts are bound, or every scene loses its script references.

[Preloader.Entrypoint]
Assembly = UnityEngine.dll
Type = SceneManager
Method = Internal_SceneLoaded

[Logging.Console]
Enabled = false

[Logging.Disk]
Enabled = true
